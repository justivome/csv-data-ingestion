x-network: &network
  networks:
    - internal

x-postgres: &postgres_environment
  POSTGRES_USER: ${POSTGRES_USER:-?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_HOST: db

services:
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      <<: *postgres_environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    <<: *network

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      <<: *postgres_environment
    depends_on:
      db:
        condition: service_healthy
    <<: *network

  backend:
    image: csv-data-ingestion-backend:${TAG:-latest}
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      <<: *postgres_environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    <<: *network
  
  frontend:
    image: csv-data-ingestion-frontend:${TAG:-latest}
    build:
      context: ./frontend
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    <<: *network

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
